<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#212121">
<title>Claude Agents</title>
<style>
:root{--bg:#fff;--panel:#f9f9f9;--line:rgba(0,0,0,.1);--txt:#212121;--mut:#6b6b6b;--me:#f4f4f4;--them:transparent;--acc:#10a37f;--sel:#ececec;--tool:#f7f7f8;--err:#fee2e2;--inp:#fff;--inpl:rgba(0,0,0,.12);--sendbg:#0d0d0d;--sendfg:#fff;--code:#f4f4f4;--shadow:0 0 0 1px rgba(0,0,0,.02),0 2px 12px rgba(0,0,0,.06)}
@media(prefers-color-scheme:dark){:root{--bg:#212121;--panel:#171717;--line:rgba(217,217,227,.1);--txt:#ececec;--mut:#9b9b9b;--me:#2f2f2f;--sel:#2f2f2f;--tool:#2a2a2a;--err:#4a1f1f;--inp:#2f2f2f;--inpl:rgba(217,217,227,.15);--sendbg:#fff;--sendfg:#0d0d0d;--code:#0d0d0d;--shadow:none}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:16px/1.6 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,Cantarell,"Noto Sans",sans-serif;background:var(--bg);color:var(--txt);overflow:hidden;-webkit-font-smoothing:antialiased}
#app{display:flex;height:100dvh;margin:0 auto;background:var(--bg)}
#side{width:260px;background:var(--panel);display:flex;flex-direction:column;min-width:0;flex:none}
#main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
header{display:flex;align-items:center;gap:4px;padding:8px 10px;background:transparent;min-height:52px}
#main header{padding:8px 16px}
header h1{font-size:16px;font-weight:600;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
#side header h1{font-size:15px}
header .sub{font-size:12px;font-weight:400;color:var(--mut)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:8px 10px;border-radius:10px}
button:hover{background:var(--sel)}
.ic{font-size:18px;line-height:1}
.ic svg{width:18px;height:18px;display:block}   /* the new-chat icon is an inline SVG (Lucide "square-pen", as Omnichat uses) and takes the button's colour */
#search{margin:2px 10px 8px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--txt);font:inherit;font-size:14px;outline:0}
#search:focus{border-color:var(--accent,var(--inpl));background:var(--bg)}
#cp,#hp{position:fixed;z-index:30;display:none;max-height:260px;overflow-y:auto;background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.35);padding:4px;font-size:13px}
#mm{position:fixed;z-index:40;display:none;background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.35);padding:4px;font-size:13px;min-width:200px}
#mm div{padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}#mm div:hover{background:var(--sel)}
#cp div,#hp div{display:flex;gap:10px;padding:5px 9px;border-radius:8px;cursor:pointer;white-space:nowrap}#cp div.sel,#hp div.sel{background:var(--sel)}#hp div{max-width:min(720px,92vw)}#hp div span{overflow:hidden;text-overflow:ellipsis}#hp .hd{color:var(--mut);font-size:11px;cursor:default}
#xp{position:fixed;z-index:31;display:none;background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.35);padding:10px;width:230px;font-size:13px}#xp .q{margin-bottom:8px;line-height:1.35}#xp .q small{display:block;color:var(--mut);font-size:12px;margin-top:2px}#xp .bt{display:flex;gap:8px}#xp button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--line)}#xp #xpGo{background:#e5484d;color:#fff;border-color:#e5484d}
#cp{max-width:min(720px,92vw)}#cp div{flex-wrap:wrap;white-space:normal;overflow-wrap:anywhere}
#cp b{font-family:"Roboto Mono",ui-monospace,Consolas,monospace;font-weight:600}#cp span{color:var(--mut);overflow:hidden;text-overflow:ellipsis}
#list{flex:1;overflow-y:auto;padding:0 8px 8px}
.row{display:flex;gap:10px;padding:8px 10px;cursor:pointer;border-radius:10px;align-items:center;margin-bottom:1px}
.row:hover{background:var(--sel)}.row.on{background:var(--sel)}
.av{flex:none;width:8px;height:8px;border-radius:50%;font-size:0;color:transparent;position:relative;opacity:.55}
.av.live{opacity:1;box-shadow:0 0 0 3px color-mix(in srgb,#10a37f 22%,transparent)}
.av.busy{box-shadow:0 0 0 3px color-mix(in srgb,#f59e0b 35%,transparent)}
.rb{flex:1;min-width:0}.r1,.r2{display:flex;gap:8px;justify-content:space-between}
.rt{font-size:14px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rm{font-size:11px;color:var(--mut);flex:none}
.rs{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
#msgs{flex:1;overflow-y:auto;padding:12px max(16px,calc((100% - 48rem)/2)) 8px;display:flex;flex-direction:column;gap:18px}
.b{max-width:100%;word-wrap:break-word;overflow-wrap:anywhere;position:relative}
#pics{display:none;gap:8px;flex-wrap:wrap;margin:0 max(16px,calc((100% - 48rem)/2)) 6px}#pics.on{display:flex}
.pic{position:relative}.pic img{height:64px;max-width:120px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block}
.pic button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;padding:0;border-radius:50%;background:var(--txt);color:var(--bg);font-size:11px;line-height:20px}
.tw{overflow-x:auto;margin:6px 0;max-width:100%}.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}.tw th,.tw td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}.tw th{background:var(--sel);font-weight:600;white-space:nowrap}
.b.me{align-self:flex-end;max-width:min(80%,40rem);background:var(--me);border-radius:24px;padding:8px 18px}
.b.ai{align-self:stretch;padding:0 2px}
.b.tool{align-self:flex-start;background:var(--tool);border:1px solid var(--line);border-radius:12px;padding:6px 12px;font-size:13px;color:var(--mut);max-width:100%;cursor:pointer}
.b.tool .tx{display:none}.b.tool.open .tx{display:block}
.b.tool .hl{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:"Roboto Mono",ui-monospace,Consolas,monospace;font-size:12px}.b.tool.open .hl{display:none}
.b.tool.call{border-style:dashed}
.b.me{cursor:pointer}.b.me.folded{opacity:.75}.b.me.folded::after{content:"▸ " attr(data-hid) " hidden";display:block;font-size:11px;color:var(--mut);margin-top:2px}
.b.err{align-self:center;background:var(--err);border-radius:12px;padding:6px 14px}
.ts{display:none}
.tx p{margin:0 0 .85em}.tx p:last-child{margin:0}
.tx pre{background:var(--code);border:1px solid var(--line);padding:12px 14px;border-radius:12px;overflow-x:auto;font:13px/1.5 "Roboto Mono",ui-monospace,Consolas,monospace;margin:.6em 0}
.tx code{font:.875em "Roboto Mono",ui-monospace,Consolas,monospace;background:var(--code);padding:2px 6px;border-radius:6px}.tx pre code{background:none;padding:0;font-size:inherit}
.day{align-self:center;color:var(--mut);font-size:12px;padding:3px 10px;margin:8px 0}
#typing{padding:0 max(16px,calc((100% - 48rem)/2));height:22px;font-size:13px;color:var(--mut)}
#ask{margin:0 max(16px,calc((100% - 48rem)/2)) 8px;background:var(--tool);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:none}
#ask .opt{display:block;width:100%;text-align:left;margin-top:6px;background:var(--sel);border-radius:12px}
#ask .opt:hover{background:var(--inpl)}
#bar{display:flex;gap:8px;align-items:flex-end;margin:0 max(16px,calc((100% - 48rem)/2)) 20px;padding:6px 8px 6px 18px;background:var(--inp);border:1px solid var(--inpl);border-radius:26px;box-shadow:var(--shadow)}
#inp{flex:1;resize:none;max-height:200px;padding:9px 0;border:0;background:transparent;color:var(--txt);font:inherit;outline:0;line-height:1.5}
#inp::placeholder{color:var(--mut)}
#send{background:var(--sendbg);color:var(--sendfg);width:36px;height:36px;border-radius:50%;padding:0;flex:none;margin-bottom:1px}
#send:hover{background:var(--sendbg);opacity:.85}
#send:disabled{opacity:.25;cursor:default}
#empty{margin:auto;color:var(--mut);text-align:center;font-size:15px}
#back{display:none}
dialog{border:1px solid var(--line);border-radius:20px;background:var(--bg);color:var(--txt);padding:0;width:min(440px,94vw);box-shadow:0 10px 40px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog select,dialog textarea{background:var(--inp);color:var(--txt);border:1px solid var(--inpl);border-radius:12px;font:inherit;outline:0}
.dh{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600}.dh span{flex:1}
.db{padding:14px 16px;max-height:70vh;overflow-y:auto}
/* usage dialog: one compact chip per account, like the Ctrl+Alt+C panel (number, session and weekly % with reset time) */
.nacc{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin-bottom:6px;font-size:12.5px;font-variant-numeric:tabular-nums;cursor:pointer}.nacc.st{opacity:.5}.nacc .ni{font-weight:600;min-width:64px}
.nacc .nu span{color:var(--mut)}
#dNew{width:min(600px,96vw)}.nacc{flex-wrap:nowrap}.nacc input{flex:none;margin:0}.nacc .ni,.nacc .nu{white-space:nowrap}.nacc .nu{min-width:0;overflow:hidden;text-overflow:ellipsis}
.p0{color:#2fb383}.p1{color:#c9a227}.p2{color:#f5a623}.p3{color:#e5484d}
@media(max-width:640px){.nacc .rw{display:none}.nacc{font-size:12px;padding:6px 8px}.nacc .ni{min-width:0}}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--txt);color:var(--bg);padding:8px 16px;border-radius:12px;display:none;z-index:20}
@media(max-width:800px){
 #side{width:100%}#main{display:none}
 body.chat #side{display:none}body.chat #main{display:flex}
 #back{display:block}#msgs{padding:10px 14px}#typing{padding:0 14px}#ask{margin:0 12px 8px}#bar{margin:0 10px 10px}.b.me{max-width:88%}
}
</style>
</head>
<body>
<div id="app">
 <section id="side">
  <header><h1>Claude Agents<div class="sub" id="hs"></div></h1>
   <button id="bNew" title="New chat" aria-label="New chat"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"/></svg></span></button></header>
  <input id="search" placeholder="Search chats" autocomplete="off" title="Same query language as the Ctrl+Alt+C panel: words, //title x, //status busy, //account name, !word, a||b, /s/age, /fts words (full text), /fts/live, /fts/archive">
  <div id="list"></div>
 </section>
 <section id="main">
  <header><button id="back"><span class="ic">←</span></button><h1 id="ct">Select a chat<div class="sub" id="cs"></div></h1><button id="bExit" title="Exit session (runs /exit and closes the shell)" aria-label="Exit session" style="display:none"><span class="ic">⏻</span></button></header>
  <div id="msgs"><div id="empty">Pick a conversation on the left,<br>or start a new one with the New chat button at the top.</div></div>
  <div id="typing"></div><div id="ask"></div>
  <div id="pics"></div>
  <div id="bar"><textarea id="inp" rows="1" placeholder="Message" disabled></textarea><button id="send" disabled><span class="ic">➤</span></button></div>
 </section>
</div>
<dialog id="dNew"><div class="dh"><span>New chat</span><button onclick="dNew.close()">✕</button></div><div class="db">
 <div id="nAcc"></div>
 <textarea id="nTxt" rows="4" placeholder="First message (optional)" style="width:100%;padding:8px;border-radius:8px"></textarea>
 <button id="nGo" style="background:var(--acc);color:#fff;margin-top:8px;width:100%">Start</button></div></dialog>
<div id="xp"><div class="q">Exit this session?<small>Runs /exit and closes the shell window. Resume it later from the archive.</small></div><div class="bt"><button id="xpGo">Exit</button><button id="xpNo">Cancel</button></div></div><div id="mm"></div><div id="cp"></div><div id="hp"></div>
<div id="toast"></div>
<script src="/dsl.js"></script>
<script>
const $=id=>document.getElementById(id);
const H={"X-Requested-With":"claude-agents-web"};
let convs=[],cur=null,last=0,polling=0,accounts=[];
const COL=["#d97757","#6b8afd","#2fb67c","#b05ad6","#e0a030","#e5484d","#3aa0c8","#8a8f98"];
const colOf=a=>COL[Math.max(0,["claude","claude2","claude3","claude4","claude5","claude6","claude7","claude8"].indexOf(a))%8];
function toast(t){const e=$("toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",2500)}
async function api(path,opt={}){
 const r=await fetch("/api/v1"+path,{...opt,headers:{...H,...(opt.body?{"Content-Type":"application/json"}:{})},credentials:"same-origin"});
 if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||r.status);
 return r.json()}
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function md(t){
 const parts=t.split(/```/);
 const inl=x=>x.replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>");
 const cells=l=>{l=l.trim().replace(/^\|/,"").replace(/\|$/,"");return l.split("|").map(c=>c.trim())};
 const isSep=l=>/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l)&&l.includes("-");
 const isRow=l=>/^\s*\|.*\|\s*$/.test(l);
 const table=ls=>{const h=cells(ls[0]),al=cells(ls[1]).map(c=>/^:-*:$/.test(c)?"center":/-:$/.test(c)?"right":"");
  const td=(tag,c,i)=>`<${tag}${al[i]?` style="text-align:${al[i]}"`:""}>${inl(c)}</${tag}>`;
  return '<div class="tw"><table><thead><tr>'+h.map((c,i)=>td("th",c,i)).join("")+"</tr></thead><tbody>"+
   ls.slice(2).map(l=>"<tr>"+cells(l).map((c,i)=>td("td",c,i)).join("")+"</tr>").join("")+"</tbody></table></div>"};
 const block=x=>{ // paragraphs and pipe tables (a table may follow a text line with no blank line between)
  const ls=x.split("\n"),out=[];let para=[];
  const flush=()=>{if(para.join("").trim())out.push("<p>"+inl(para.join("\n")).replace(/\n/g,"<br>")+"</p>");para=[]};
  for(let i=0;i<ls.length;i++){
   if(isRow(ls[i])&&i+1<ls.length&&isSep(ls[i+1])){let j=i+2;while(j<ls.length&&isRow(ls[j]))j++;flush();out.push(table(ls.slice(i,j)));i=j-1}
   else para.push(ls[i])}
  flush();return out.join("")};
 return parts.map((p,i)=>{
  if(i%2){const nl=p.indexOf("\n");return "<pre><code>"+esc(nl>=0&&nl<20&&!/\s/.test(p.slice(0,nl))?p.slice(nl+1):p)+"</code></pre>"}
  return esc(p).split(/\n{2,}/).map(block).join("")}).join("")}
const hm=ts=>ts?new Date(ts).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}):"";
function ago(e){const d=Date.now()/1000-e;if(d<60)return"now";if(d<3600)return Math.floor(d/60)+"m";if(d<86400)return Math.floor(d/3600)+"h";return Math.floor(d/86400)+"d"}
/* ---- search box: the shared picker query DSL, the same engine (/dsl.js = ~/.config/quickshell/lib/dsl.js) and grammar as the
   search box of the desktop Ctrl+Alt+C panel: bare words, //field value (fuzzy field names), ! negation, a||b alternatives,
   /s/field[/dir] sort, and /fts[/live|/archive] words (full-text over the conversations, via claude-history).
   This list has the panel's title/status/tokens/msgs/age/path/account types; pid, host, tmux-* and hypr-* are not part of
   the web API, so filters on them match nothing. /ft /at /rt /g are parsed and inert here, as in the panel. */
const TYPES=["title","status","tokens","msgs","age","path","account","fts"];   // "fts" is a filter, never a /s key
const SCHEMA=window.DSL?DSL.makeSchema(TYPES,[],[]):null;
const FTS_RE=/(^|\s)(!?)\/fts(?:\/([a-z,-]+))?(?=\s|$)(?:\s+((?:"[^"]*"|(?!\/)\S+)(?:\s+(?!\/)\S+)*))?/g;   // same token as the panel's
const FTSH={};   // lower-case term -> {session_id: score} once fetched, null while pending
function ftsScope(keys){if(!keys)return{live:true,archive:true};const r=DSL.resolveNames(keys,["claude-live","claude-archive","tmux"]);return{live:r.indexOf("claude-live")>=0,archive:r.indexOf("claude-archive")>=0}}
function ftsScopes(q){let u=null,m;FTS_RE.lastIndex=0;
 while((m=FTS_RE.exec(q))!==null){const s=ftsScope(m[3]);u=u?{live:u.live||s.live,archive:u.archive||s.archive}:s}
 return u}
const rewriteFts=q=>q.replace(FTS_RE,(all,lead,neg,sc,arg)=>arg?lead+neg+"/fv/fts \""+arg.replace(/"/g,"")+"\"":lead);   // `/fts words` is sugar for `/fv/fts words`
const rowOf=c=>({title:c.title||"",status:c.live?(c.live.status||"live"):"archive",tokens:c.tokens!=null?String(c.tokens):"",
 msgs:c.msgs!=null?String(c.msgs):"",age:Math.max(0,Math.floor(Date.now()/1000-c.mtime))+"s",   // "<n>s": /s/age = newest first, as in the panel
 path:(c.cwd||"").replace(/^\/home\/[^/]+(?=\/|$)/,"~"),
 account:[c.account_label||"",c.account||""].filter(Boolean),_c:c});
let ftsPending=0;
function fetchFts(term){if(term in FTSH)return;FTSH[term]=null;ftsPending++;
 api("/fts?q="+encodeURIComponent(term)).then(r=>{FTSH[term]=r.hits||{}}).catch(()=>{FTSH[term]={}}).finally(()=>{ftsPending--;renderList()})}
/* base query (/base-query, /bq): as the FIRST token it is transparent - the rest of the line is the query and the stored base
   query is NOT applied meanwhile (Enter replaces it). Enter: bare "/bq" shows the current base query in a read-only copyable dialog; "/bq <q>" saves q. */
let QDEFAULT="";try{QDEFAULT=localStorage.getItem("query-default")||""}catch(e){}
let QHIST=[];try{QHIST=JSON.parse(localStorage.getItem("query-default-history")||"[]")}catch(e){}
const baseCandidates=()=>{const c=QDEFAULT.trim();return(c?[c]:[]).concat(QHIST.filter(x=>x!==c))};
const DEFCMD=/^\s*(!?)\/(?:base-query|bq)(?:(\s+)([\s\S]*))?$/;   // 1 "!" = negated (the rows the base query filters OUT), 2 whitespace, 3 rest
const effectiveQuery=raw=>{const m=DEFCMD.exec(raw);if(m)return(m[3]||"").trim();return(QDEFAULT.trim()+" "+raw.trim()).trim()};
function baseQueryView(){
 const ov=document.createElement("div");ov.style.cssText="position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center";
 ov.innerHTML='<div style="background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(520px,92vw);box-shadow:0 10px 30px rgba(0,0,0,.35)"><div style="font-weight:600;margin-bottom:4px">Base query</div><div style="font-size:13px;color:var(--mut);margin-bottom:10px">'+(QDEFAULT?"Runs in front of every query. Change it with /bq &lt;query&gt; + Enter.":"(none set) Type /bq &lt;query&gt; and Enter to set one.")+'</div><input id="bqi" readonly style="width:100%;font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--inpl);background:var(--inp);color:var(--txt)"><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button id="bqk" style="font:inherit;padding:6px 14px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--txt);cursor:pointer">Copy</button><button id="bqc" style="font:inherit;padding:6px 14px;border-radius:8px;border:0;background:var(--sendbg);color:var(--sendfg);cursor:pointer">Close</button></div></div>';
 document.body.appendChild(ov);const i=ov.querySelector("#bqi");i.value=QDEFAULT;i.focus();i.select();
 const close=()=>{ov.remove();$("search").focus()};
 ov.querySelector("#bqc").onclick=close;ov.onclick=e=>{if(e.target===ov)close()};
 ov.querySelector("#bqk").onclick=()=>{i.select();try{navigator.clipboard.writeText(QDEFAULT)}catch(e){document.execCommand("copy")}};
 ov.onkeydown=e=>{if(e.key==="Enter"||e.key==="Escape"){e.preventDefault();e.stopPropagation();close()}else if(e.key==="Tab"){e.preventDefault()}}}
function runDefaultCmd(raw){const m=DEFCMD.exec(raw);if(!m||m[1]==="!")return null;   // "!/bq" is only a view
 if(m[2]===undefined){baseQueryView();return""}
 const prev=QDEFAULT.trim();QDEFAULT=(m[3]||"").trim();if(QDEFAULT&&prev&&prev!==QDEFAULT&&QHIST.indexOf(prev)<0)QHIST=[prev].concat(QHIST);if(QDEFAULT){QHIST=[QDEFAULT].concat(QHIST.filter(x=>x!==QDEFAULT)).slice(0,100);try{localStorage.setItem("query-default-history",JSON.stringify(QHIST))}catch(e){}}try{if(QDEFAULT)localStorage.setItem("query-default",QDEFAULT);else localStorage.removeItem("query-default")}catch(e){}

  if(k==="ArrowDown"||(e.ctrlKey&&k==="j")){e.preventDefault();CPS.sel=(CPS.sel+1)%CPS.c.length;return cpsDraw()}
  if(k==="ArrowUp"||(e.ctrlKey&&k==="k")){e.preventDefault();CPS.sel=(CPS.sel+CPS.c.length-1)%CPS.c.length;return cpsDraw()}
  if(k==="Tab"||k==="Enter"){e.preventDefault();return cpsApply(CPS.sel)}
  if(k==="Escape"){e.preventDefault();e.stopPropagation();return cpsClose()}}
 else if(k==="Enter"&&!e.isComposing){{const r=runDefaultCmd($("search").value);if(r!==null){e.preventDefault();$("search").value=r;renderList()}}}
 else if(k==="Tab"&&!e.shiftKey||(e.ctrlKey&&(k===" "||e.code==="Space"))){if(cpsStart())e.preventDefault()}});
$("search").addEventListener("blur",()=>setTimeout(cpsClose,150));
$("cp").addEventListener("mousedown",e=>{const d=e.target.closest("[data-i]");if(d){e.preventDefault();cpsApply(+d.dataset.i)}});
const xpClose=()=>{$("xp").style.display="none"};
$("bExit").onclick=e=>{if(!cur)return;e.stopPropagation();
 const r=$("bExit").getBoundingClientRect(),x=$("xp");x.style.display="block";
 x.style.top=(r.bottom+6)+"px";x.style.left=Math.max(8,Math.min(innerWidth-x.offsetWidth-8,r.right-x.offsetWidth))+"px";$("xpGo").focus()};
$("xpNo").onclick=xpClose;
addEventListener("mousedown",e=>{if(!e.target.closest("#xp,#bExit"))xpClose()});
addEventListener("keydown",e=>{if(e.key==="Escape")xpClose()});
$("xpGo").onclick=async()=>{xpClose();if(!cur)return;
 const b=$("bExit");b.disabled=true;
 const id=cur.id;let done=false;
 try{await api("/conversations/"+id+"/exit",{method:"POST",body:"{}"});toast("Session exited");done=true}
 catch(e){if(/not live|409/i.test(e.message)){toast("Session already exited");done=true}else toast("Exit failed: "+e.message)}
 b.disabled=false;
 if(done&&cur&&cur.id===id){markExited(id);$("back").onclick()}   // gone from the left pane at once, and back to the empty main screen
 else loadList()};
$("back").onclick=()=>{try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}$("bExit").style.display="none";document.body.classList.remove("chat");polling++;cur=null;renderList()};
function fmtReset(s){if(!s)return"";const d=(new Date(s)-Date.now())/60000;if(d<=0)return"resets now";return d<120?"resets in "+Math.round(d)+" min":d<2880?"resets in "+Math.round(d/60)+" h":"resets in "+Math.round(d/1440)+" d"}
const cls=p=>p>=90?"x":p>=70?"w":"";
const rel=s=>{if(!s)return"";const m=Math.round((new Date(s)-Date.now())/60000);if(m<=0)return"now";if(m<60)return m+"m";if(m<1440)return Math.floor(m/60)+"h "+m%60+"m";return Math.floor(m/1440)+"d "+Math.floor(m%1440/60)+"h"};
const ramp=p=>p==null?"":p>=90?"p3":p>=70?"p2":p>=50?"p1":"p0";
const part=(name,pct,rs)=>`<span>${name}</span> ${typeof pct!=="number"?"--":`<b class="${ramp(pct)}">${Math.round(pct)}%</b>`} ${rs?`<span class="rw">resets in</span> ${rel(rs)}`:""}`;
const accKey=k=>k==="claude"?"claude1":k;
async function renderNewAccounts(){
 let us={};try{const u=await api("/usage");for(const a of u.accounts||[])us[accKey(a.account)]=a}catch(e){}
 $("nAcc").innerHTML=accounts.map((a,i)=>{const u=us[a.dir_key]||us[accKey(a.dir_key)];
  return `<label class="nacc${u&&u.stale?" st":""}"><input type="radio" name="nacc" value="${esc(a.dir_key)}"${i?"":" checked"}><span class="ni">${esc(a.dir_key)}</span><span class="nu">${u?part("session",u.session_pct,u.session_resets_at)+" &nbsp; "+part("weekly",u.weekly_pct,u.weekly_resets_at):""}</span></label>`}).join("")}
$("bNew").onclick=async()=>{try{accounts=await api("/accounts")}catch(e){return}
 dNew.showModal();await renderNewAccounts()};
$("nGo").onclick=async()=>{const t=$("nTxt").value.trim(),acc=(document.querySelector("input[name=nacc]:checked")||{}).value;
 // instant: close the dialog and show the new chat at once; the daemon boots the session in the background
 dNew.close();$("nTxt").value="";
 cur=null;polling++;document.body.classList.add("chat");$("bExit").style.display="none";
 $("ct").firstChild.textContent=t?t.slice(0,60):"New chat";$("cs").textContent="starting…";
 $("msgs").innerHTML="";$("ask").style.display="none";$("typing").textContent="";$("inp").disabled=true;$("send").disabled=true;
 if(t){const p=document.createElement("div");p.id="pend";p.className="b me";p.textContent=t;$("msgs").appendChild(p)}
 try{const r=await api("/spawn",{method:"POST",body:JSON.stringify({account:acc,text:t,async:true})});
  await loadList();const c=convs.find(x=>x.id==r.session_id)||r.conversation;if(c){await open(c);$("inp").focus()}}
 catch(e){toast("Spawn failed: "+e.message);document.body.classList.remove("chat");renderList()}};
const hashId=()=>{const m=/^#\/chat\/([0-9a-fA-F-]{36})$/.exec(location.hash);return m?m[1]:null};
async function openFromHash(){const id=hashId();if(!id||(cur&&cur.id==id))return;
 const c=convs.find(x=>x.id==id)||{id,title:"",account_label:""};open(c)}
addEventListener("hashchange",()=>{if(hashId())openFromHash();else if(cur){$("back").onclick()}});
async function start(){await loadList();await openFromHash();setInterval(()=>{if(!document.hidden)loadList()},10000)}
start();
</script>
</body>
